---
- name: Deploy application
  hosts: webservers
  become: yes
  vars_files:
    - ../vars/app_config.yml
    - ../vars/db_config.yml

  tasks:
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"

    - name: Show config
      debug:
        msg: "{{ app_name }} v{{ app_version }} -> {{ db_host }}:{{ db_port }}"
